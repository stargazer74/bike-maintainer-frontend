server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Angular router fallback — unknown paths resolve client-side.
    # Note: this container only serves static assets. /api requests need an
    # external reverse proxy in front of this and the backend (see CLAUDE.md).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
