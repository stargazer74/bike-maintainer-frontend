# Security headers of the payment page /abo/bezahlen only (nginx.conf.template). The one documented exception to
# "no requests to third parties from the browser": this page loads Paddle.js from Paddle's CDN, which opens the
# checkout in an iframe of Paddle and talks to Paddle's API. Everything else is the same as security-headers.conf.
#
# Allowed for Paddle: the script and its styles/images from cdn.paddle.com, the checkout frame (live and sandbox),
# requests to *.paddle.com, and the Payment Request API for the checkout frame (Apple Pay / Google Pay). Domains of
# Paddle Retain (ProfitWell) are deliberately not allowed: Retain is switched off, and should Paddle.js try to load
# it anyway, the browser blocks it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.paddle.com; style-src 'self' 'unsafe-inline' https://cdn.paddle.com; img-src 'self' data: https://cdn.paddle.com; font-src 'self'; connect-src 'self' https://*.paddle.com; frame-src https://buy.paddle.com https://sandbox-buy.paddle.com; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://buy.paddle.com\" \"https://sandbox-buy.paddle.com\"), usb=()" always;
# The page always comes fresh, so a changed policy applies at once.
add_header Cache-Control "no-store" always;
