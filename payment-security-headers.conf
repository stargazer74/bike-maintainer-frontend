# Security headers of the payment page /abo/bezahlen only (nginx.conf.template). The one documented exception to
# "no requests to third parties from the browser": this page loads Paddle.js from Paddle's CDN, which opens the
# checkout in an iframe of Paddle and talks to Paddle's API. Everything else is the same as security-headers.conf.
#
# Allowed for Paddle (from the code of Paddle.js v2.11.0): the script, its stylesheet and images from cdn.paddle.com
# (sandbox: sandbox-cdn.paddle.com), the checkout frame from buy.paddle.com / sandbox-buy.paddle.com (an error page
# from the CDN), API requests to api.paddle.com / sandbox-api.paddle.com, and the Payment Request API for the
# checkout frame (Apple Pay / Google Pay). What the checkout frame loads itself is governed by Paddle's own policy.
#
# Paddle Retain (ProfitWell) is deliberately NOT allowed: Paddle.Initialize() loads public.profitwell.com/js/
# profitwell.js in the live environment whenever a client token is set – even with Retain switched off and without a
# customer. This policy blocks that request in the browser, so it is never sent.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.paddle.com; style-src 'self' 'unsafe-inline' https://cdn.paddle.com https://sandbox-cdn.paddle.com; img-src 'self' data: https://cdn.paddle.com https://sandbox-cdn.paddle.com; font-src 'self'; connect-src 'self' https://api.paddle.com https://sandbox-api.paddle.com; frame-src https://buy.paddle.com https://sandbox-buy.paddle.com https://cdn.paddle.com https://sandbox-cdn.paddle.com; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://buy.paddle.com\" \"https://sandbox-buy.paddle.com\"), usb=()" always;
# The page always comes fresh, so a changed policy applies at once.
add_header Cache-Control "no-store" always;
