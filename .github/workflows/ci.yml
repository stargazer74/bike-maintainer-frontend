name: CI

on:
  pull_request:
  push:
    branches: [ main ]
    # Release tags (vX.Y.Z) additionally publish the images, see the publish job.
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload of the Trivy results to the Security tab.
      security-events: write
    defaults:
      run:
        working-directory: bike-maintainer-frontend
    steps:
      # npm run generate:api reads the spec via ../bike-maintainer-api, so both repos are checked out side by side.
      - name: Check out frontend
        uses: actions/checkout@v7
        with:
          path: bike-maintainer-frontend

      # The branch with the same name if it exists (PRs that depend on an open API PR), else main.
      - name: Select API branch
        id: api-branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/stargazer74/bike-maintainer-api.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out API spec (${{ steps.api-branch.outputs.ref }})
        uses: actions/checkout@v7
        with:
          repository: stargazer74/bike-maintainer-api
          ref: ${{ steps.api-branch.outputs.ref }}
          path: bike-maintainer-api

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bike-maintainer-frontend/package-lock.json

      # The OpenAPI generator CLI runs a Java jar.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Generate API client
        run: npm run generate:api

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

      # Trivy: the report steps send all findings from MEDIUM up to Security → Code scanning without failing the build;
      # the gate steps fail it – and thereby a release, since publish needs this job – on CRITICAL/HIGH vulnerabilities
      # that have a fix. Accepted exceptions go into .trivyignore with a reason.

      # npm dependencies from package-lock.json (runtime dependencies; the image itself only ships the built files).
      - name: Scan npm dependencies for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: bike-maintainer-frontend/package-lock.json
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-dependencies.sarif
          exit-code: '0'

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities in npm dependencies (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: bike-maintainer-frontend/package-lock.json
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table
          exit-code: '1'

      # The runtime image (nginx on Alpine) as it would be published; scanned for linux/amd64.
      - name: Build image for scanning
        run: docker build -t bike-maintainer-frontend:scan .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: bike-maintainer-frontend:scan
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities in the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: bike-maintainer-frontend:scan
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table
          exit-code: '1'

      # Pull requests from forks get no write token; their results are only in the log.
      - name: Upload Trivy results (dependencies)
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-dependencies.sarif
          category: trivy-dependencies

      - name: Upload Trivy results (image)
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # The Docker build needs the generated client in its context (it is gitignored).
      - name: Upload API client for the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: api-client
          path: bike-maintainer-frontend/src/app/api-client/
          retention-days: 1

  # Builds the multi-arch image (amd64 + arm64) and pushes it to ghcr.io – only for release tags, not for pushes to
  # main or PRs. Tag vX.Y.Z -> image tags X.Y.Z, X.Y, X and latest.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out frontend
        uses: actions/checkout@v7

      - name: Download API client
        uses: actions/download-artifact@v8
        with:
          name: api-client
          path: src/app/api-client

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # The Angular build stage runs natively on the runner ($BUILDPLATFORM); only the nginx stage is per platform.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
