<div class="forgot">
  <mat-card class="forgot__card">
    <h1 class="forgot__title">{{ 'forgotPassword.title' | transloco }}</h1>

    @if (sent()) {
      <p class="forgot__text" role="status">{{ 'forgotPassword.sent' | transloco }}</p>
    } @else {
      <p class="forgot__subtitle">{{ 'forgotPassword.subtitle' | transloco }}</p>

      <form novalidate (ngSubmit)="onSubmit()">
        <div class="field">
          <label class="field__label" for="forgot-email">{{
            'forgotPassword.email' | transloco
          }}</label>
          <input
            id="forgot-email"
            name="email"
            type="email"
            class="field__input"
            autocomplete="email"
            required
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
          />
        </div>

        <app-altcha #altcha />

        @if (errorKey(); as key) {
          <p class="field__error forgot__error" role="alert">{{ key | transloco }}</p>
        }

        <button type="submit" class="btn btn--primary forgot__submit" [disabled]="submitting()">
          @if (submitting()) {
            <mat-spinner diameter="16" />
          }
          {{ 'forgotPassword.submit' | transloco }}
        </button>
      </form>
    }

    <a class="forgot__link" routerLink="/anmelden">{{ 'forgotPassword.toLogin' | transloco }}</a>
  </mat-card>
</div>
