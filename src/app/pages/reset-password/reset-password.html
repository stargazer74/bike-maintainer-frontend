<div class="reset">
  <mat-card class="reset__card">
    <h1 class="reset__title">{{ 'resetPassword.title' | transloco }}</h1>

    @if (invalid()) {
      <p class="field__error reset__text" role="alert">{{ 'resetPassword.invalid' | transloco }}</p>
      <a class="btn btn--primary reset__submit" routerLink="/passwort-vergessen">
        {{ 'resetPassword.requestNew' | transloco }}
      </a>
    } @else {
      <form novalidate (ngSubmit)="onSubmit()">
        <div class="field">
          <label class="field__label" for="reset-password">
            {{ 'resetPassword.password' | transloco }}
          </label>
          <input
            id="reset-password"
            name="password"
            type="password"
            class="field__input"
            autocomplete="new-password"
            required
            aria-describedby="reset-password-hint"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
          />
          <span id="reset-password-hint" class="reset__hint">
            {{ 'account.password.hint' | transloco }}
          </span>
        </div>

        <div class="field">
          <label class="field__label" for="reset-password-repeat">
            {{ 'resetPassword.passwordRepeat' | transloco }}
          </label>
          <input
            id="reset-password-repeat"
            name="passwordRepeat"
            type="password"
            class="field__input"
            autocomplete="new-password"
            required
            [ngModel]="passwordRepeat()"
            (ngModelChange)="passwordRepeat.set($event)"
          />
        </div>

        @if (errorKey(); as key) {
          <p class="field__error reset__error" role="alert">{{ key | transloco }}</p>
        }

        <button type="submit" class="btn btn--primary reset__submit" [disabled]="submitting()">
          @if (submitting()) {
            <mat-spinner diameter="16" />
          }
          {{ 'resetPassword.submit' | transloco }}
        </button>
      </form>
    }
  </mat-card>
</div>
