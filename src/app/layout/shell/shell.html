<div class="shell">
  <mat-toolbar class="shell__toolbar">
    <span class="shell__brand-icon">
      <mat-icon fontSet="material-symbols-outlined">two_wheeler</mat-icon>
    </span>
    <span class="shell__brand-name">{{ 'app.name' | transloco }}</span>

    <div class="shell__toolbar-actions">
      @if (authStore.isLoggedIn()) {
        <button
          mat-icon-button
          type="button"
          class="shell__dashboard-button"
          routerLink="/dashboard"
          [attr.aria-label]="'shell.toDashboard' | transloco"
        >
          <mat-icon fontSet="material-symbols-outlined">dashboard</mat-icon>
        </button>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="shell__vehicle-select">
          <mat-select
            [value]="selectedVehicleId()"
            [placeholder]="'shell.selectVehicle' | transloco"
            (selectionChange)="onSelectVehicle($event.value)"
          >
            @for (vehicle of vehicles.value(); track vehicle.id) {
              <mat-option [value]="vehicle.id">{{ vehicle.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      }

      <div class="shell__language" role="group" [attr.aria-label]="'language.switch' | transloco">
        @for (lang of languages; track lang) {
          <button
            type="button"
            class="shell__language-option"
            [class.shell__language-option--active]="language.lang() === lang"
            [attr.aria-pressed]="language.lang() === lang"
            [attr.lang]="lang"
            [title]="'language.' + lang | transloco"
            (click)="onSelectLanguage(lang)"
          >
            {{ lang.toUpperCase() }}
          </button>
        }
      </div>

      @if (authStore.isLoggedIn()) {
        <button mat-stroked-button type="button" class="shell__add-button" (click)="onAddVehicleClick()">
          <mat-icon fontSet="material-symbols-outlined">add</mat-icon>
          <span>{{ 'shell.addVehicle' | transloco }}</span>
        </button>

        <button
          mat-icon-button
          type="button"
          class="shell__user-button"
          [matMenuTriggerFor]="userMenu"
          [attr.aria-label]="'shell.userMenu' | transloco"
        >
          <mat-icon fontSet="material-symbols-outlined">account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu" xPosition="before">
          <div class="shell__user-email" mat-menu-item disabled>{{ userName() }}</div>
          @if (config.isHousehold()) {
            <button mat-menu-item type="button" class="shell__logout" (click)="onLogout()">
              <mat-icon fontSet="material-symbols-outlined">switch_account</mat-icon>
              <span>{{ 'shell.switchProfile' | transloco }}</span>
            </button>
          } @else {
            <button mat-menu-item type="button" class="shell__logout" (click)="onLogout()">
              <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
              <span>{{ 'shell.logout' | transloco }}</span>
            </button>
          }
        </mat-menu>
      }
    </div>
  </mat-toolbar>

  <div class="shell__content">
    <main class="shell__main">
      <router-outlet />
    </main>
  </div>
</div>
