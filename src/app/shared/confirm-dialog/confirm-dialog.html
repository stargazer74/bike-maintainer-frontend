<h2 mat-dialog-title class="confirm-dialog__title">
  <mat-icon fontSet="material-symbols-outlined">warning</mat-icon>
  {{ data.title | transloco: data.params }}
</h2>

<mat-dialog-content>
  <p class="confirm-dialog__message">{{ data.message | transloco: data.params }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" class="btn btn--ghost confirm-dialog__cancel" (click)="close(false)">
    {{ 'common.cancel' | transloco }}
  </button>
  <button
    type="button"
    class="btn btn--danger confirm-dialog__confirm"
    cdkFocusInitial
    (click)="close(true)"
  >
    {{ data.confirm | transloco }}
  </button>
</mat-dialog-actions>
