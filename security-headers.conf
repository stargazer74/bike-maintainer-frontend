# Security headers for every response of the SPA (included at server level and again in every location that sets
# its own add_header, because nginx does not inherit add_header into such locations).
# HSTS is set by the TLS proxy in front (nginx-proxy-manager), which is the only hop that speaks HTTPS.
#
# CSP: everything from this origin only. style-src needs 'unsafe-inline': Angular and the ALTCHA widget add styles at
# runtime. worker-src blob: for the ALTCHA proof-of-work workers. Switch the header name to
# Content-Security-Policy-Report-Only to test changes without blocking anything.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
